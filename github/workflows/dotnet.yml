name: Build and test

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore packages
        run: dotnet restore Backend/PenielPlaceMinistries.csproj

      - name: Build
        run: dotnet build Backend/PenielPlaceMinistries.csproj --configuration Release --no-restore

      - name: Run tests (only if a test project exists)
        if: ${{ hashFiles('**/*Tests.csproj') != '' }}
        run: dotnet test --configuration Release --verbosity normal
